<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0656/3941/6045/files/Favicon_logo_32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>ACC Academy – Học viện Đào tạo Kỹ năng AI, Chuyên môn & Kỹ năng mềm</title>
    <meta name="description" content="Nâng tầm năng lực với các khóa học AI, Kỹ năng Chuyên môn & Kỹ năng Mềm đỉnh cao tại ACC Academy – Đã đào tạo cho 17,000+ học viên và 70+ doanh nghiệp hàng đầu." />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ACC Academy – Nền tảng Đào tạo Kỹ năng AI & Doanh nghiệp" />
    <meta property="og:description" content="Khám phá lộ trình học tập tối ưu, tự động hóa công việc với AI và phát triển kỹ năng toàn diện cùng các chuyên gia ACC." />
    <meta property="og:image" content="/images/logo3.png" />
    <meta property="og:url" content="https://accacademy.vn" />
    
    <!-- Instant Pre-mount Anti-flash Styles -->
    <style>
      body {
        margin: 0;
        background-color: #f8fafc;
      }
      #app-pre-mount {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 999999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .pre-mount-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .pre-mount-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .pre-logo-badge {
        background: #022b9f;
        color: #ffffff;
        padding: 4px 10px;
        border-radius: 6px;
        font-weight: 900;
        font-size: 14px;
        letter-spacing: 1px;
      }
      .pre-logo-text {
        color: #0f172a;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .pre-mount-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #0284c7;
        border-radius: 50%;
        animation: preSpin 0.65s infinite linear;
      }
      @keyframes preSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Google Fonts: Mulish, Manrope, Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&family=Mulish:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <!-- Video CDN Preconnect for fast video loading -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    <link rel="preconnect" href="https://drive.google.com" crossorigin>
    <link rel="preconnect" href="https://drive.usercontent.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
    <link rel="dns-prefetch" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">
    <link rel="dns-prefetch" href="https://drive.google.com">
    <link rel="dns-prefetch" href="https://drive.usercontent.google.com">
    <link href="/css/gp-global.css" rel="stylesheet" type="text/css" media="all">
    <link href="/css/theme.css" rel="stylesheet" type="text/css" media="all">
    <link href="/css/magic-text-animate.css" rel="stylesheet" type="text/css" media="all">
    <link href="/css/zalo.css" rel="stylesheet" type="text/css" media="all">
    <link href="/css/glider.min.css" rel="stylesheet" type="text/css" media="all">
    <link href="/css/freegifts-main.min.css" rel="stylesheet" type="text/css" media="all">
    
    <!-- Cropper.js for precise image cropping like InNhanhTYD -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js" defer></script>
      <!-- Google Translate Custom Styling: Keep default Google banner and tooltips hidden -->
    <style>
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
      #google_translate_element {
        display: none !important;
      }
      .skiptranslate:not(.vue-allowed) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-pre-mount">
        <div class="pre-mount-box">
          <div class="pre-mount-logo">
            <span class="pre-logo-badge">ACC</span>
            <span class="pre-logo-text">ACADEMY</span>
          </div>
          <div class="pre-mount-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script src="/js/magic-text-animate.js" defer></script>
      <!-- Google Translate Element Container -->
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'vi',
            includedLanguages: 'en,vi',
            autoDisplay: false
          }, 'google_translate_element');
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>
  </body>
</html>
